[workspace]
members = [
    "crates/daemon",
    "crates/resolver",
    "crates/config",
    "crates/policy",
    "crates/blocklist",
    "crates/analytics",
    "crates/diagnostics",
    "crates/risk",
    "crates/openroot",
]
resolver = "2"

# Only dependencies that a member crate actually uses belong here. Declaring
# unused ones widens the supply-chain surface and misleads anyone auditing the
# manifest. `clap`, `interprocess`, `nix`, `async-trait`, `thiserror` and
# `rustrus` were all listed without a single reference in the workspace; none
# of them appear in Cargo.lock, confirming nothing resolved them.
[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.32", features = ["full"] }
moka = { version = "0.12", features = ["future"] }
tracing = "0.1"
tracing-subscriber = "0.3"
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "stream"] }
ipnet = "2.12"
sha2 = "0.10"
subtle = "2.6"
