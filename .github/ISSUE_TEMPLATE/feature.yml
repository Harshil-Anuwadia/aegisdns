name: Feature request
description: Propose a focused improvement to AegisDNS
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: Explain the user problem before proposing an interface or implementation.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is difficult or impossible today, and who encounters it?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful outcome and an example workflow.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Existing commands, configuration, or workarounds you tried.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - DNS and resolver
        - Filtering and policy
        - Installer and CLI
        - Dashboard
        - Privacy and analytics
        - Documentation
        - Other
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This request contains no credentials, private DNS history, client addresses, or other sensitive data.
          required: true
