services:
  aegisdns:
    build:
      context: .
      network: host
    container_name: aegisdns
    restart: unless-stopped
    network_mode: host
    read_only: true
    tmpfs:
      - /run
      - /tmp
    environment:
      # Authoritative location of config.json inside the container; matches the
      # bind mount below so daemon and resolver never disagree about the file.
      AEGIS_CONFIG: /app/config.json
      AEGIS_HOST_IP: ${AEGIS_HOST_IP:-}
      AEGIS_ADMIN_PASSWORD: ${AEGIS_ADMIN_PASSWORD:-}
      # Disabled by default: remote favicon services learn requested domains.
      AEGIS_FAVICON_REMOTE_LOOKUP: ${AEGIS_FAVICON_REMOTE_LOOKUP:-false}
      TZ: ${TZ:-UTC}
    volumes:
      - aegisdns_data:/var/lib/aegisdns
      # Mounted read-only over the data volume so the daemon reads exactly the
      # file in this directory. AEGIS_CONFIG pins the location explicitly
      # rather than relying on the process working directory.
      - ./config.json:/app/config.json:ro,z
      - ./blocklists:/var/lib/aegisdns/blocklists:ro,z
      - ./openroot.json:/var/lib/aegisdns/openroot.json:ro,z
    cap_drop:
      - ALL
    # Used by the entrypoint only to migrate file ownership and drop to uid 10001.
    # The daemon retains NET_BIND_SERVICE only, for DNS and optional DHCP.
    cap_add:
      - CHOWN
      - FOWNER
      - SETUID
      - SETGID
      - SETPCAP
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    stop_grace_period: 15s

  openroot:
    build:
      context: .
      dockerfile: Dockerfile.openroot
      network: host
    container_name: openroot
    restart: unless-stopped
    network_mode: host
    read_only: true
    user: "10001:10001"
    volumes:
      - ./openroot.json:/var/lib/aegisdns/openroot.json:ro,z
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64

volumes:
  aegisdns_data:
